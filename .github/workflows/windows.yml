name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DVORAKX_E2E: 1

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...
