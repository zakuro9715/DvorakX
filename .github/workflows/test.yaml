name: Windows

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DVORAKX_E2E: 1

jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run tests
        run: go test ./...
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run tests
        run: go test ./...
