name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  DVORAKX_E2E: 1

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Prepare Linux E2E input devices
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ ! -c /dev/uinput ]]; then
            sudo modprobe uinput
          fi
          sudo udevadm control --ping
          sudo udevadm settle --timeout=10
          sudo chown "$(id -un)" /dev/uinput
          test -w /dev/uinput
          sudo mkdir -p /run/udev/rules.d
          {
            echo "SUBSYSTEM==\"input\", KERNEL==\"event*\", ATTRS{name}==\"DvorakZ E2E source\", OWNER=\"$(id -un)\""
            echo "SUBSYSTEM==\"input\", KERNEL==\"event*\", ATTRS{name}==\"DvorakZ virtual keyboard\", OWNER=\"$(id -un)\""
          } | sudo tee /run/udev/rules.d/99-dvorakz-e2e.rules
          sudo udevadm control --reload-rules
      - name: Test
        env:
          CGO_ENABLED: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: go test ./... -tags=e2e -coverprofile=coverage.out -covermode=atomic
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: true
          use_oidc: true
