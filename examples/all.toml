# DvorakX configuration reference for the currently implemented syntax.

[meta]
default = "&base"

[global]
remaps = [
	{ caps = "ctrl" },
	{ x = "@block-key" },
	{ y = "@copy-paste" },
	{ z = "@copy-paste2" },
]

[global.actions]
block-key = { noop = [] }
copy-paste  = { send-keys = ["ctrl", "c", "v"] }
copy-paste2 = { send-keys = "ctrl c v" }

[src]
def = ["a", "b", "c", "d"]

[base]
def = ["b", "@disable-key", "c", "d"]

[base.actions]
disable-key = { noop = [] }

[base.remaps]
z = "@disable-key"
met = "alt"

# A string definition may refer to the source definition directly.
[alternate]
def = "#src"
